<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballers Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
        h1 { font-size: 1.6rem; }
        .lineup-row, .player-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .lineup-row label { width: 75px; }
        .lineup-row select { flex: 1; min-width: 0; padding: 8px; }
        #total { margin: 20px 0; font-size: 1.4rem; font-weight: bold; }
        #lineupStatus { font-weight: bold; }
        #lineupStatus.over-limit { color: #a00000; }
        #ruleNote { color: #444; }
        section { border-top: 1px solid #ccc; padding-top: 12px; margin-top: 24px; }
        #addPlayerForm, .edit-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
        #addPlayerForm label, .edit-form label { display: flex; flex-direction: column; gap: 4px; }
        input, select, button { font: inherit; padding: 7px; }
        input[type="text"] { width: 190px; max-width: 100%; }
        #playerNumber { width: 80px; }
        .edit-form { width: 100%; }
        .player-row { justify-content: space-between; border-bottom: 1px solid #eee; padding: 5px 0; }
        .player-row span { overflow-wrap: anywhere; }
        .player-row button { flex-shrink: 0; }
        #message { min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>Player Lineup Calculator</h1>
    <p>Choose up to five players to see the total classification points.</p>
    <label for="division">Competition:</label>
    <select id="division">
        <option value="adult1">NWBA Adult Division I</option>
        <option value="adult2">NWBA Adult Division II</option>
        <option value="adult3">NWBA Adult Division III</option>
        <option value="college">NWBA Intercollegiate</option>
        <option value="women">NWBA Women's Division</option>
        <option value="iwbf">IWBF</option>
    </select>
    <form id="playerForm">
        <div class="lineup-row"><label for="dropdown1">Player 1:</label><select id="dropdown1"></select></div>
        <div class="lineup-row"><label for="dropdown2">Player 2:</label><select id="dropdown2"></select></div>
        <div class="lineup-row"><label for="dropdown3">Player 3:</label><select id="dropdown3"></select></div>
        <div class="lineup-row"><label for="dropdown4">Player 4:</label><select id="dropdown4"></select></div>
        <div class="lineup-row"><label for="dropdown5">Player 5:</label><select id="dropdown5"></select></div>
        <div id="total" aria-live="polite">Total: 0.0</div>
        <p id="lineupStatus" aria-live="polite"></p>
        <p id="ruleNote"></p>
    </form>

    <section aria-labelledby="rosterHeading">
        <h2 id="rosterHeading">Manage your player list</h2>
        <p>Your changes are saved in this browser only.</p>
        <form id="addPlayerForm">
            <label>Player name <input id="playerName" type="text" maxlength="80" required></label>
            <label>Player number <input id="playerNumber" type="text" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" required></label>
            <label>Classification <select id="playerValue" required>
                <option value="">Choose a class</option>
                <option value="1.0">1.0</option><option value="1.5">1.5</option>
                <option value="2.0">2.0</option><option value="2.5">2.5</option>
                <option value="3.0">3.0</option><option value="3.5">3.5</option>
                <option value="4.0">4.0</option><option value="4.5">4.5</option>
            </select></label>
            <button type="submit">Add player</button>
        </form>
        <p id="message" role="status"></p>
        <div id="playerList"></div>
        <button id="clearPlayers" type="button">Clear player list</button>
        <button id="resetPlayers" type="button">Restore original player list</button>
    </section>

    <script>
        const defaultPlayers = [
            { id: 1, name: "Rod #1", value: 4.5 },
            { id: 45, name: "Zak #45", value: 4.5 },
            { id: 13, name: "Kyle #13", value: 4.5 },
            { id: 55, name: "Chris (Coach) #55", value: 4.0 },
            { id: 15, name: "Kai #15", value: 3.5 },
            { id: 31, name: "Shanice #31", value: 3.5 },
            { id: 11, name: "Korin #11", value: 3.0 },
            { id: 5, name: "Anderson #5", value: 3.0 },
            { id: 25, name: "Luis #25", value: 3.0 },
            { id: 4, name: "Jarrod #4", value: 2.5 },
            { id: 33, name: "Gage #33", value: 2.5 },
            { id: 8, name: "Karlton #8", value: 2.5 },
            { id: 24, name: "Esteban #24", value: 2.5 },
            { id: 2, name: "Caden #2", value: 2.0 },
            { id: 20, name: "Francois #20", value: 1.5 },
            { id: 10, name: "Wolff #10", value: 1.5 },
            { id: 22, name: "Carlos #22", value: 1.5 },
            { id: 6, name: "Zakhar #6", value: 1.0 },
            { id: 23, name: "Matt #23", value: 1.0 }
        ];
        const storageKey = 'ballers-players-v1';
        const classificationValues = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5];
        const selects = Array.from(document.querySelectorAll('#playerForm select'));
        const division = document.getElementById('division');
        const divisionRules = {
            adult1: { limit: 15, note: 'Standard adult limit. This calculator does not apply adjustments for women playing on men’s teams.' },
            adult2: { limit: 15, note: 'Standard adult limit. This calculator does not apply adjustments for women playing on men’s teams.' },
            adult3: { limit: 15, note: 'No more than two players classified 3.5 or higher may play at once. Adjustments for women playing on men’s teams are not applied.' },
            college: { limit: 14, note: 'Intercollegiate limit: 14.0 with five players, 11.0 with four or fewer. Adjustments for women playing on men’s teams are not applied.' },
            women: { limit: 15, note: 'Standard NWBA Women’s Division limit. Check current event rules for other requirements.' },
            iwbf: { limit: 14, note: 'IWBF five-player limit for official competitions.' }
        };
        try {
            const savedDivision = localStorage.getItem('ballers-division-v1');
            if (Object.hasOwn(divisionRules, savedDivision)) division.value = savedDivision;
        } catch (error) { /* The selector still works when browser storage is unavailable. */ }
        const message = document.getElementById('message');

        function withNumber(player) {
            if (typeof player.number === 'string') return player;
            const match = player.name.match(/^(.*) #([0-9]+)$/);
            return match ? { ...player, name: match[1], number: match[2] } : { ...player, number: '' };
        }

        function displayName(player) {
            return `${player.name}${player.number ? ` #${player.number}` : ''} (${player.value.toFixed(1)})`;
        }

        function loadPlayers() {
            try {
                const saved = JSON.parse(localStorage.getItem(storageKey));
                if (Array.isArray(saved) && saved.every(player =>
                    typeof player.id === 'string' && typeof player.name === 'string' &&
                    classificationValues.includes(player.value))) {
                    return saved.map(withNumber);
                }
            } catch (error) { /* Use the original list if browser storage is unavailable. */ }
            return defaultPlayers.map(player => withNumber({ ...player, id: String(player.id) }));
        }

        let players = loadPlayers();

        function savePlayers() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(players));
                message.textContent = '';
            } catch (error) {
                message.textContent = 'Changes will last until you close or reload this page. Browser storage is unavailable.';
            }
        }

        function updateLineup() {
            const selected = selects.map(select => select.value);
            selects.forEach(select => {
                for (const option of select.options) {
                    option.disabled = option.value !== '' && option.value !== select.value && selected.includes(option.value);
                }
            });
            const lineup = selected.map(id => players.find(item => item.id === id)).filter(Boolean);
            const total = lineup.reduce((sum, player) => sum + player.value, 0);
            const rule = divisionRules[division.value];
            const highClassCount = lineup.filter(player => player.value >= 3.5).length;
            const activeLimit = division.value === 'college' && lineup.length < 5 ? 11 : rule.limit;
            const overPoints = total > activeLimit;
            const overHighClass = division.value === 'adult3' && highClassCount > 2;
            const status = document.getElementById('lineupStatus');
            document.getElementById('total').textContent = `Total: ${total.toFixed(1)}`;
            if (lineup.length < 5) {
                const remaining = 5 - lineup.length;
                status.textContent = `Select ${remaining} more player${remaining === 1 ? '' : 's'} for a five-player lineup. ${division.value === 'college' ? `${activeLimit.toFixed(1)}-point limit for four or fewer players${lineup.length ? `: ${overPoints ? 'exceeded' : 'within limit'}` : ''}.` : `Five-player limit: ${rule.limit.toFixed(1)}.`}`;
            } else if (overPoints || overHighClass) {
                const reasons = [];
                if (overPoints) reasons.push(`over the ${activeLimit.toFixed(1)}-point limit`);
                if (overHighClass) reasons.push('more than two players are classified 3.5 or higher');
                status.textContent = `Lineup exceeds this division’s standard rules: ${reasons.join('; ')}.`;
            } else {
                status.textContent = `Base total is within the ${rule.limit.toFixed(1)}-point limit${division.value === 'adult3' ? ' and Division III high-class limit' : ''}.`;
            }
            status.classList.toggle('over-limit', overPoints || (lineup.length === 5 && overHighClass));
            document.getElementById('ruleNote').textContent = rule.note;
        }

        function render() {
            const selected = selects.map(select => select.value);
            selects.forEach((select, index) => {
                select.replaceChildren(new Option('Select a player', ''));
                players.forEach(player => select.add(new Option(displayName(player), player.id)));
                select.value = players.some(player => player.id === selected[index]) ? selected[index] : '';
            });
            const list = document.getElementById('playerList');
            list.replaceChildren();
            players.forEach(player => {
                const row = document.createElement('div');
                row.className = 'player-row';
                const label = document.createElement('span');
                label.textContent = displayName(player);
                const edit = document.createElement('button');
                edit.type = 'button';
                edit.textContent = 'Edit';
                edit.setAttribute('aria-label', `Edit ${player.name}`);
                edit.addEventListener('click', () => {
                    const form = document.createElement('form');
                    form.className = 'edit-form';
                    const nameLabel = document.createElement('label');
                    nameLabel.textContent = 'Player name';
                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.maxLength = 80;
                    nameInput.required = true;
                    nameInput.value = player.name;
                    nameLabel.append(nameInput);
                    const numberLabel = document.createElement('label');
                    numberLabel.textContent = 'Player number';
                    const numberInput = document.createElement('input');
                    numberInput.type = 'text';
                    numberInput.inputMode = 'numeric';
                    numberInput.pattern = '[0-9]{1,3}';
                    numberInput.maxLength = 3;
                    numberInput.required = true;
                    numberInput.value = player.number;
                    numberLabel.append(numberInput);
                    const classLabel = document.createElement('label');
                    classLabel.textContent = 'Classification';
                    const classSelect = document.createElement('select');
                    classSelect.required = true;
                    classificationValues.forEach(value => classSelect.add(new Option(value.toFixed(1), value.toFixed(1))));
                    classSelect.value = player.value.toFixed(1);
                    classLabel.append(classSelect);
                    const save = document.createElement('button');
                    save.type = 'submit';
                    save.textContent = 'Save';
                    const cancel = document.createElement('button');
                    cancel.type = 'button';
                    cancel.textContent = 'Cancel';
                    cancel.addEventListener('click', render);
                    form.append(nameLabel, numberLabel, classLabel, save, cancel);
                    form.addEventListener('submit', event => {
                        event.preventDefault();
                        const name = nameInput.value.trim();
                        const number = numberInput.value.trim();
                        const value = Number(classSelect.value);
                        if (!name || !/^[0-9]{1,3}$/.test(number) || !classificationValues.includes(value)) return;
                        player.name = name;
                        player.number = number;
                        player.value = value;
                        savePlayers();
                        render();
                    });
                    row.replaceChildren(form);
                    nameInput.focus();
                });
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.textContent = 'Remove';
                remove.setAttribute('aria-label', `Remove ${player.name}`);
                remove.addEventListener('click', () => {
                    players = players.filter(item => item.id !== player.id);
                    savePlayers();
                    render();
                });
                row.append(label, edit, remove);
                list.append(row);
            });
            updateLineup();
        }

        selects.forEach(select => select.addEventListener('change', updateLineup));
        division.addEventListener('change', () => {
            try { localStorage.setItem('ballers-division-v1', division.value); } catch (error) { /* Keep the choice for this visit. */ }
            updateLineup();
        });
        document.getElementById('addPlayerForm').addEventListener('submit', event => {
            event.preventDefault();
            const name = document.getElementById('playerName').value.trim();
            const number = document.getElementById('playerNumber').value.trim();
            const value = Number(document.getElementById('playerValue').value);
            if (!name || !/^[0-9]{1,3}$/.test(number) || !classificationValues.includes(value)) {
                message.textContent = 'Enter a name, a player number (up to 3 digits), and a classification from 1.0 to 4.5 in 0.5 steps.';
                return;
            }
            players.push({ id: crypto.randomUUID(), name, number, value });
            savePlayers();
            event.target.reset();
            render();
        });
        document.getElementById('resetPlayers').addEventListener('click', () => {
            if (!confirm('Restore the original player list? Your changes will be removed.')) return;
            players = defaultPlayers.map(player => withNumber({ ...player, id: String(player.id) }));
            savePlayers();
            render();
        });
        document.getElementById('clearPlayers').addEventListener('click', () => {
            if (!confirm('Remove every player from your list?')) return;
            players = [];
            savePlayers();
            render();
        });
        render();
    </script>
</body>
</html>
