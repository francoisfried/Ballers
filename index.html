<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballers Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
        h1 { font-size: 1.6rem; }
        .lineup-row, .player-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .lineup-row label { width: 75px; }
        .lineup-row select { flex: 1; min-width: 0; padding: 8px; }
        #total { margin: 20px 0; font-size: 1.4rem; font-weight: bold; }
        section { border-top: 1px solid #ccc; padding-top: 12px; margin-top: 24px; }
        #addPlayerForm { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
        #addPlayerForm label { display: flex; flex-direction: column; gap: 4px; }
        input, button { font: inherit; padding: 7px; }
        input[type="text"] { width: 190px; max-width: 100%; }
        input[type="number"] { width: 80px; }
        .player-row { justify-content: space-between; border-bottom: 1px solid #eee; padding: 5px 0; }
        .player-row span { overflow-wrap: anywhere; }
        .player-row button { flex-shrink: 0; }
        #message { min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>Player Lineup Calculator</h1>
    <p>Choose up to five players to see the total classification points.</p>
    <form id="playerForm">
        <div class="lineup-row"><label for="dropdown1">Player 1:</label><select id="dropdown1"></select></div>
        <div class="lineup-row"><label for="dropdown2">Player 2:</label><select id="dropdown2"></select></div>
        <div class="lineup-row"><label for="dropdown3">Player 3:</label><select id="dropdown3"></select></div>
        <div class="lineup-row"><label for="dropdown4">Player 4:</label><select id="dropdown4"></select></div>
        <div class="lineup-row"><label for="dropdown5">Player 5:</label><select id="dropdown5"></select></div>
        <div id="total" aria-live="polite">Total: 0.0</div>
    </form>

    <section aria-labelledby="rosterHeading">
        <h2 id="rosterHeading">Manage your player list</h2>
        <p>Your changes are saved in this browser only.</p>
        <form id="addPlayerForm">
            <label>Player name <input id="playerName" type="text" maxlength="80" required></label>
            <label>Classification <input id="playerValue" type="number" min="1" max="4.5" step="0.5" required></label>
            <button type="submit">Add player</button>
        </form>
        <p id="message" role="status"></p>
        <div id="playerList"></div>
        <button id="resetPlayers" type="button">Restore original player list</button>
    </section>

    <script>
        const defaultPlayers = [
            { id: 1, name: "Rod #1", value: 4.5 },
            { id: 45, name: "Zak #45", value: 4.5 },
            { id: 13, name: "Kyle #13", value: 4.5 },
            { id: 55, name: "Chris (Coach) #55", value: 4.0 },
            { id: 15, name: "Kai #15", value: 3.5 },
            { id: 31, name: "Shanice #31", value: 3.5 },
            { id: 11, name: "Korin #11", value: 3.0 },
            { id: 5, name: "Anderson #5", value: 3.0 },
            { id: 25, name: "Luis #25", value: 3.0 },
            { id: 4, name: "Jarrod #4", value: 2.5 },
            { id: 33, name: "Gage #33", value: 2.5 },
            { id: 8, name: "Karlton #8", value: 2.5 },
            { id: 24, name: "Esteban #24", value: 2.5 },
            { id: 2, name: "Caden #2", value: 2.0 },
            { id: 20, name: "Francois #20", value: 1.5 },
            { id: 10, name: "Wolff #10", value: 1.5 },
            { id: 22, name: "Carlos #22", value: 1.5 },
            { id: 6, name: "Zakhar #6", value: 1.0 },
            { id: 23, name: "Matt #23", value: 1.0 }
        ];
        const storageKey = 'ballers-players-v1';
        const selects = Array.from(document.querySelectorAll('#playerForm select'));
        const message = document.getElementById('message');

        function loadPlayers() {
            try {
                const saved = JSON.parse(localStorage.getItem(storageKey));
                if (Array.isArray(saved) && saved.every(player =>
                    typeof player.id === 'string' && typeof player.name === 'string' &&
                    Number.isFinite(player.value) && player.value >= 1 && player.value <= 4.5)) {
                    return saved;
                }
            } catch (error) { /* Use the original list if browser storage is unavailable. */ }
            return defaultPlayers.map(player => ({ ...player, id: String(player.id) }));
        }

        let players = loadPlayers();

        function savePlayers() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(players));
                message.textContent = '';
            } catch (error) {
                message.textContent = 'Changes will last until you close or reload this page. Browser storage is unavailable.';
            }
        }

        function updateLineup() {
            const selected = selects.map(select => select.value);
            selects.forEach(select => {
                for (const option of select.options) {
                    option.disabled = option.value !== '' && option.value !== select.value && selected.includes(option.value);
                }
            });
            const total = selects.reduce((sum, select) => {
                const player = players.find(item => item.id === select.value);
                return sum + (player ? player.value : 0);
            }, 0);
            document.getElementById('total').textContent = `Total: ${total.toFixed(1)}`;
        }

        function render() {
            const selected = selects.map(select => select.value);
            selects.forEach((select, index) => {
                select.replaceChildren(new Option('Select a player', ''));
                players.forEach(player => select.add(new Option(`${player.name} (${player.value.toFixed(1)})`, player.id)));
                select.value = players.some(player => player.id === selected[index]) ? selected[index] : '';
            });
            const list = document.getElementById('playerList');
            list.replaceChildren();
            players.forEach(player => {
                const row = document.createElement('div');
                row.className = 'player-row';
                const label = document.createElement('span');
                label.textContent = `${player.name} (${player.value.toFixed(1)})`;
                const edit = document.createElement('button');
                edit.type = 'button';
                edit.textContent = 'Edit';
                edit.setAttribute('aria-label', `Edit ${player.name}`);
                edit.addEventListener('click', () => {
                    const name = prompt('Player name:', player.name);
                    if (name === null) return;
                    const classification = prompt('Classification (1.0 to 4.5, in 0.5 steps):', player.value.toFixed(1));
                    if (classification === null) return;
                    const value = Number(classification);
                    if (!name.trim() || !classification.trim() || !Number.isFinite(value) || value < 1 || value > 4.5 || value * 2 % 1 !== 0) {
                        message.textContent = 'Enter a name and a classification from 1.0 to 4.5 in 0.5 steps.';
                        return;
                    }
                    player.name = name.trim();
                    player.value = value;
                    savePlayers();
                    render();
                });
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.textContent = 'Remove';
                remove.setAttribute('aria-label', `Remove ${player.name}`);
                remove.addEventListener('click', () => {
                    players = players.filter(item => item.id !== player.id);
                    savePlayers();
                    render();
                });
                row.append(label, edit, remove);
                list.append(row);
            });
            updateLineup();
        }

        selects.forEach(select => select.addEventListener('change', updateLineup));
        document.getElementById('addPlayerForm').addEventListener('submit', event => {
            event.preventDefault();
            const name = document.getElementById('playerName').value.trim();
            const value = Number(document.getElementById('playerValue').value);
            if (!name || !Number.isFinite(value) || value < 1 || value > 4.5 || value * 2 % 1 !== 0) {
                message.textContent = 'Enter a name and a classification from 1.0 to 4.5 in 0.5 steps.';
                return;
            }
            players.push({ id: crypto.randomUUID(), name, value });
            savePlayers();
            event.target.reset();
            render();
        });
        document.getElementById('resetPlayers').addEventListener('click', () => {
            if (!confirm('Restore the original player list? Your changes will be removed.')) return;
            players = defaultPlayers.map(player => ({ ...player, id: String(player.id) }));
            savePlayers();
            render();
        });
        render();
    </script>
</body>
</html>
